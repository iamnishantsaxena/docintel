name: CI

on:
  push:
    paths-ignore: ["Legacy/**"]
  pull_request:
    paths-ignore: ["Legacy/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: docintel, POSTGRES_PASSWORD: docintel, POSTGRES_DB: docintel_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U docintel" --health-interval 3s --health-retries 20
    env:
      # Integration tests run against real Postgres here (SQLite locally).
      DATABASE_URL: postgresql+psycopg://docintel:docintel@localhost:5432/docintel_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests eval
      - run: pytest -q
      - name: Regex-only eval (no LLM in CI)
        run: python -m eval.run_eval --no-llm

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images and smoke-test the stack
        env: { JWT_SECRET: ci-only-secret-0123456789abcdef0123456789, LLM_ENABLED: "false" }
        run: |
          docker compose up -d --build --wait
          curl -fsS http://localhost:8080/api/health
          docker compose down -v
